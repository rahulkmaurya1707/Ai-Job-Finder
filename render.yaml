services:
  - type: web
    name: ai-job-finder
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run ui/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.fileWatcherType none --server.maxUploadSize 10 --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: none
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
